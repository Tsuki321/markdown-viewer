name: Markdown Viewer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    name: Browser smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify the editor and preview in Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.65.1
          python3 -m http.server 4173 --bind 127.0.0.1 --directory .. &
          server=$!
          trap 'kill "$server"' EXIT
          url="http://127.0.0.1:4173/$(basename "$PWD")/"
          curl --silent --fail --retry 10 --retry-connrefused "$url" --output /dev/null
          SITE_URL="$url" node <<'NODE'
          const assert = require('node:assert/strict');
          const { chromium } = require('playwright');

          async function verify() {
            const browser = await chromium.launch({ channel: 'chrome' });
            try {
              const context = await browser.newContext({
                permissions: ['clipboard-read', 'clipboard-write']
              });
              const page = await context.newPage();
              page.setDefaultTimeout(15000);
              await page.goto(process.env.SITE_URL, { waitUntil: 'domcontentloaded' });

              const sourceTab = page.getByRole('tab', { name: 'Source', exact: true });
              const previewTab = page.getByRole('tab', { name: 'Preview', exact: true });
              const source = page.locator('#markdown-source');
              await sourceTab.click();
              const pasted = [
                '#Hello', '', '$x^2$', '', String.raw`\[\frac{1}{2}\]`, '',
                '| Name |', '| --- |', '| Example |'
              ].join('\n');
              await page.evaluate(text => navigator.clipboard.writeText(text), pasted);
              await source.fill('');
              await page.getByRole('button', { name: /^Paste\b/ }).click();
              await page.waitForFunction(expected => document.querySelector('#markdown-source').value === expected, pasted);
              await page.getByRole('button', { name: /^Format\b/ }).click();
              await page.waitForFunction(() => document.querySelector('#markdown-source').value.startsWith('# Hello\n'));
              const formatted = await source.inputValue();

              await previewTab.click();
              assert.equal(await previewTab.getAttribute('aria-selected'), 'true');
              const preview = page.locator('#preview-content');
              await preview.getByRole('heading', { name: 'Hello', level: 1 }).waitFor();
              await preview.getByRole('cell', { name: 'Example' }).waitFor();
              await preview.locator('mjx-container').nth(1).waitFor({ timeout: 30000 });

              await page.getByRole('button', { name: /^Copy\b/ }).click();
              await page.waitForFunction(async expected => (await navigator.clipboard.readText()) === expected, formatted);

              await page.reload({ waitUntil: 'domcontentloaded' });
              await sourceTab.click();
              assert.equal(await source.inputValue(), formatted);

              const display = page.locator('#display-menu summary');
              const initialFont = await source.evaluate(node => getComputedStyle(node).fontSize);
              await display.click();
              await page.getByRole('button', { name: 'Increase source text size' }).click();
              await page.getByLabel('Theme', { exact: true }).selectOption('light');
              await page.reload({ waitUntil: 'domcontentloaded' });
              await page.waitForFunction(() => document.documentElement.dataset.theme === 'light');
              assert.notEqual(await source.evaluate(node => getComputedStyle(node).fontSize), initialFont);

              const phone = await browser.newContext({ viewport: { width: 320, height: 720 }, isMobile: true, hasTouch: true });
              const mobile = await phone.newPage();
              await mobile.goto(process.env.SITE_URL, { waitUntil: 'domcontentloaded' });
              const mobileSource = mobile.getByRole('textbox', { name: 'Markdown source' });
              await mobile.waitForFunction(() => document.querySelector('#markdown-source').wrap === 'soft');
              assert.equal((await mobileSource.boundingBox()).width, 320);
              const mobileSettings = await mobile.locator('#display-menu summary').boundingBox();
              assert.ok(mobileSettings.x + mobileSettings.width <= 320 && mobileSettings.height >= 44);
              await mobileSource.fill('# Mobile preview\n\n' + 'A long preview paragraph. '.repeat(250));
              await mobile.getByRole('tab', { name: 'Preview' }).tap();
              await mobile.getByRole('heading', { name: 'Mobile preview' }).waitFor();
              assert.ok(await mobile.evaluate(() => {
                window.scrollTo(0, 300);
                return window.scrollY > 0 && document.querySelector('.site-header').getBoundingClientRect().top === 0;
              }));
            } finally {
              await browser.close();
            }
          }

          verify().catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

  build:
    name: Stage the GitHub Pages site
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v6
      - name: Stage the static site
        run: |
          mkdir _site
          cp index.html styles.css app.js markdown.js _site/
          for path in favicon.svg assets vendor; do
            if [ -e "$path" ]; then
              cp -R "$path" _site/
            fi
          done
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: [build, smoke-test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the site
        id: deployment
        uses: actions/deploy-pages@v5
